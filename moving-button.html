<!DOCTYPE html>
<html>
<head>
  <title>Catch the Button Game</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      height: 100vh;   
      flex-direction: column;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f0f8ff;
      overflow: hidden;
      user-select: none;
    }

    #gameButton {
      position: absolute;
      background-color: #ff6347;
      border: none;
      color: white;
      border-radius: 100%;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
      transform: none;
      min-width: 200px;
      min-height: 200px;
    }
  </style>
  <audio id="hitSound" src="pop.mp3"></audio>
  <audio id="gameOverSound" src="gameover.mp3"></audio>
</head>
<body>
  <h1>🎯 Catch the Button!</h1>
  <h2>Score: <span id="scoreText">?</span></h2>
  <h3 id="highScoreDisplay">High Score: 0</h3>
  <br />
  <button id="gameButton">Catch Me!</button>
  <p>Time left: <span id="timeText">?</span>s</p>
  <script src="moving-button.js"></script>
</body>
</html>
